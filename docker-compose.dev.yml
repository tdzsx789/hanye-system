services:
  postgres:
    container_name: hanye-postgres-dev

  server:
    container_name: hanye-server-dev
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: ["node", "--watch", "index.js"]
    environment:
      NODE_ENV: development
      PORT: 5174
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-hanye}
      PGUSER: ${POSTGRES_USER:-hanye}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hanye_dev_password}
      STARTUP_DB_MAINTENANCE: ${STARTUP_DB_MAINTENANCE:-1}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_INTERNAL: ${OSS_INTERNAL:-0}
      OSS_SECURE: ${OSS_SECURE:-1}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-hanye-system/uploads}
      OSS_SIGNED_URL_EXPIRES_SECONDS: ${OSS_SIGNED_URL_EXPIRES_SECONDS:-3600}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    expose:
      - "5174"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  server-standby:
    container_name: hanye-server-standby-dev
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: ["node", "--watch", "index.js"]
    environment:
      NODE_ENV: development
      PORT: 5174
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-hanye}
      PGUSER: ${POSTGRES_USER:-hanye}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hanye_dev_password}
      STARTUP_DB_MAINTENANCE: ${STARTUP_DB_MAINTENANCE:-1}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_INTERNAL: ${OSS_INTERNAL:-0}
      OSS_SECURE: ${OSS_SECURE:-1}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-hanye-system/uploads}
      OSS_SIGNED_URL_EXPIRES_SECONDS: ${OSS_SIGNED_URL_EXPIRES_SECONDS:-3600}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    expose:
      - "5174"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    container_name: hanye-web-dev
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--port", "80", "--strictPort"]
    environment:
      VITE_API_TARGET: http://server:5174
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  web_node_modules:
  server_node_modules:
